name: Sync to Hugging Face

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://huggingface.co/spaces/aetherporium/expert-agent /tmp/hf_space
          rm -rf /tmp/hf_space/.git
          cp -r . /tmp/hf_space/
          cd /tmp/hf_space
          git init
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Sync from GitHub"
          git push https://HF_TOKEN@huggingface.co/spaces/aetherporium/expert-agent main --force
